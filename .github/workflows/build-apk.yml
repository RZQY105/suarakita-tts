name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kode
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependensi & Buat Proyek Android
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Perbaiki Resolusi Gradle & Tambahkan Izin Penyimpanan
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<uses-permission android:name="android.permission.INTERNET" \/>/<uses-permission android:name="android.permission.INTERNET" \/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="32" \/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" \/>/' $MANIFEST

          cat << 'EOF' >> android/build.gradle

          subprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.22'
                  }
              }
          }
          EOF

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK ke Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SuaraKita-TTS-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
