<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SuaraKita TTS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; user-select: none; }
    textarea { user-select: text; }
    @keyframes wave {
      0%, 100% { height: 22%; }
      50% { height: 95%; }
    }
    .bar-anim { animation: wave 0.65s ease-in-out infinite; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between p-4 font-sans">

  <div class="w-full max-w-md mx-auto space-y-4">
    <!-- Header -->
    <div class="bg-gradient-to-r from-indigo-600 to-violet-600 rounded-3xl p-4 shadow-xl shadow-indigo-950/50 flex items-center justify-between border border-white/10">
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 rounded-2xl bg-white/15 backdrop-blur flex items-center justify-center text-2xl shadow-inner">🎙️</div>
        <div>
          <h1 class="font-bold text-lg tracking-tight">SuaraKita</h1>
          <p class="text-xs text-indigo-100/80">Text-to-Speech Indonesia</p>
        </div>
      </div>
      <span class="text-[11px] font-semibold px-3 py-1 rounded-full bg-emerald-400/20 text-emerald-200 border border-emerald-300/30">
        ● Suara Natural
      </span>
    </div>

    <!-- Pengaturan Suara -->
    <div class="bg-slate-900/90 border border-slate-800 rounded-3xl p-4 space-y-4 shadow-lg">
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1.5">Bahasa / Logat</label>
          <select id="langSelect" class="w-full text-sm bg-slate-800 border border-slate-700 text-slate-100 rounded-2xl px-3 py-2.5 focus:outline-none focus:border-indigo-500">
            <option value="id">Indonesia (Natural)</option>
            <option value="jv">Jawa (Indonesia)</option>
            <option value="su">Sunda (Indonesia)</option>
            <option value="en">Inggris (US)</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1.5">Kecepatan: <span id="rateVal" class="text-indigo-400 font-bold">1.0x</span></label>
          <input id="rateSlider" type="range" min="0.6" max="1.6" step="0.1" value="1.0"
            class="w-full accent-indigo-500 mt-3 cursor-pointer" />
        </div>
      </div>

      <!-- Area Naskah -->
      <div>
        <div class="flex justify-between items-center mb-1.5">
          <label class="text-xs font-medium text-slate-400">Masukkan Naskah</label>
          <div class="flex gap-3">
            <button id="pasteBtn" class="text-xs text-indigo-400 font-medium active:opacity-70">Tempel</button>
            <button id="clearBtn" class="text-xs text-rose-400 font-medium active:opacity-70">Hapus</button>
          </div>
        </div>
        <textarea id="textInput" rows="5"
          class="w-full rounded-2xl border border-slate-700/80 bg-slate-950/70 p-3.5 text-sm text-slate-100 leading-relaxed focus:outline-none focus:border-indigo-500"
          placeholder="Tulis teks yang ingin diubah menjadi suara...">Halo! Selamat datang di aplikasi SuaraKita. Teks ini akan diubah menjadi suara manusia yang jernih dan bisa langsung disimpan ke penyimpanan HP Anda.</textarea>
        <div class="flex justify-between text-[11px] text-slate-400 mt-2 px-1">
          <span id="charCount">151 karakter</span>
          <span id="statusText" class="font-semibold text-indigo-400">Siap digunakan</span>
        </div>
      </div>

      <!-- Visualizer -->
      <div class="bg-slate-950/80 rounded-2xl p-3 border border-slate-800/80 flex flex-col items-center justify-center h-
